[project]
name = "ai-tech-review-api"
version = "0.1.0"
description = "MVP backend for local project playbook distillation and proposal review."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "griffelib>=2,<3",
  "mcp>=1.19.0,<2",
  "openai>=2.26.0,<3",
  "openai-agents==0.17.0",
  "pydantic>=2.12.2,<3",
  "pydantic-settings>=2.4.0",
  "requests>=2.0,<3",
  "types-requests>=2.0,<3",
  "typing-extensions>=4.12.2,<5",
  "uvicorn>=0.30.0",
  "websockets>=15.0,<17",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
